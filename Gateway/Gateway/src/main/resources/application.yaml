spring:
  application:
    name: Gateway

  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/users/**
          filters:
            - JwtCookieToHeaderFilter
            - StripPrefix=1

        - id: pipeline-service
          uri: http://localhost:8082
          predicates:
            - Path=/pipeline/**
          filters:
            - JwtCookieToHeaderFilter
            - StripPrefix=1

        - id: payment-service
          uri: http://localhost:8085
          predicates:
            - Path=/payment/**
          filters:
            - JwtCookieToHeaderFilter
            - StripPrefix=1



  codec:
    max-in-memory-size: 50MB

jwt:
  secret: cCd8F0jjX/cYQvSUWvVO8ipDrO/4fd1iEgNTCwWDjMxneZcK1OwRj/Mgn3gDyBoPo7YZS+hyUBi6Scd2LrKJLw==

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true

server:
  port: 8080
